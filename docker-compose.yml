services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laqeeni
      POSTGRES_PASSWORD: laqeeni_dev_password
      POSTGRES_DB: laqeeni
    ports:
      - "5432:5432"
    volumes:
      - laqeeni-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laqeeni -d laqeeni"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://laqeeni:laqeeni_dev_password@db:5432/laqeeni?schema=public
      PORT: 4000
    ports:
      - "4000:4000"
    command: sh -c "npx prisma db push --skip-generate && node dist/main.js"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"

volumes:
  laqeeni-db:
